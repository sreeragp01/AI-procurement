version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_procurement_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=django-insecure-ai-procurement-prod-key-2026
      - ALLOWED_HOSTS=*
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - backend_data:/app/db.sqlite3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_procurement_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend_data:
